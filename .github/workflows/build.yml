name: build
on:
  push:
    paths-ignore: ["**.md", "docs/**"] # reference/ must trigger: the provenance job guards it
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # qmk_cli 1.2.0 (= :latest as of 2026-10-16; arm-none-eabi-gcc 15.2.0, qmk_toolchains @ a55a2b0).
    # Digest-pinned so the CI toolchain is fully reproducible run-to-run.
    container: ghcr.io/qmk/qmk_cli@sha256:b7d7fa8fb4432b569931de5ad59098cb788f440ed61a62c5126746b71aee0f4a
    steps:
      - name: Checkout firmware repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fw

      - name: Load pinned QMK revision
        run: grep -E '^[A-Z_]+=' fw/scripts/qmk.pin >> "$GITHUB_ENV"

      - name: Clone pinned QMK (shallow, with submodules)
        run: |
          git clone --depth 1 --branch "$QMK_TAG" \
            --recurse-submodules --shallow-submodules \
            https://github.com/qmk/qmk_firmware qmk
          test "$(git -C qmk rev-parse HEAD)" = "$QMK_SHA" \
            || { echo "::error::QMK tag $QMK_TAG no longer resolves to $QMK_SHA"; exit 1; }

      - name: Symlink keymap into the QMK tree
        run: ln -sfn "$PWD/fw/firmware/gati" qmk/keyboards/gmmk/pro/rev1/ansi/keymaps/gati

      - name: Compile
        working-directory: qmk
        run: qmk compile -kb gmmk/pro/ansi -km gati

      - name: Assert pinned toolchain
        run: |
          used=$(grep -a -o 'GCC: ([^)]*) [0-9.]*' qmk/.build/gmmk_pro_rev1_ansi_gati.elf | head -1 | sed 's/.* //')
          test "$used" = "$QMK_GCC" \
            || { echo "::error::built with arm-none-eabi-gcc $used, pinned $QMK_GCC"; exit 1; }

      - name: Lint (advisory)
        working-directory: qmk
        run: qmk lint -kb gmmk/pro/ansi -km gati || true

      - name: Report size
        run: |
          bin="qmk/gmmk_pro_rev1_ansi_gati.bin"
          size=$(wc -c < "$bin")
          echo "### Firmware: $size bytes ($((size * 100 / 262144))% of 256 KB)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gmmk_pro_rev1_ansi_gati
          path: qmk/gmmk_pro_rev1_ansi_gati.bin
          if-no-files-found: error

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck scripts
        run: shellcheck -x scripts/flash.sh .claude/hooks/guard-reference.sh

  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # git tree hash of reference/ (frozen provenance). Changing it is never intended.
      REFERENCE_TREE: b224ac4b1acd25c2cd1c464120e58481f1b80a7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: reference/ is unchanged
        run: |
          test "$(git rev-parse HEAD:reference)" = "$REFERENCE_TREE" \
            || { echo "::error::reference/ changed — it is frozen provenance (docs/DESIGN.md §3)"; exit 1; }
